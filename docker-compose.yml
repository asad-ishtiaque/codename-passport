services:
  postgres:
    image: postgres:16.4
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  web:
    restart: unless-stopped
    build: ./
    env_file:
      - .env
    command: >
      bash -c "python3 wait_for_postgres.py &&
               ./manage.py migrate &&
               ./manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./:/code
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  documentation:
    restart: unless-stopped
    build: ./
    command: python3 -m mkdocs serve
    volumes:
      - ./:/code
    ports:
      - "8001:8001"

volumes:
  postgres_data:
